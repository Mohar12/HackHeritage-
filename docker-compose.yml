# ============================================================
# docker-compose.yml
# QDS Threat Detection Framework
# ============================================================
version: "3.9"

networks:
  quantum-network:
    driver: bridge
    name: quantum-network

volumes:
  postgres-data:
    driver: local

services:

  # ----------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------
  quantum-db:
    image: postgres:16-alpine
    container_name: quantum-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hyperqds
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - quantum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hyperqds"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------
  quantum-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: quantum-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=postgresql://postgres:postgres@quantum-db:5432/hyperqds
      - QDS_AUDIT_BACKEND=postgres
    volumes:
      - ./qds_core:/app/qds_core
      - ./attack_sim:/app/attack_sim
      - ./detection_engine:/app/detection_engine
      - ./backend:/app/backend
      - ./backend:/app/api
    networks:
      - quantum-network
    depends_on:
      quantum-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # React + Vite Dashboard Service
  # ----------------------------------------------------------
  quantum-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: quantum-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
      - ./dashboard/index.html:/app/index.html
      - ./dashboard/vite.config.js:/app/vite.config.js
    networks:
      - quantum-network
    depends_on:
      quantum-backend:
        condition: service_healthy
    restart: unless-stopped
