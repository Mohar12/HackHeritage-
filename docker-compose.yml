# ============================================================
# docker-compose.yml
# QDS Threat Detection Framework
# ============================================================
version: "3.9"

networks:
  quantum-network:
    driver: bridge
    name: quantum-network

services:

  # ----------------------------------------------------------
  # FastAPI Backend Service
  # ----------------------------------------------------------
  quantum-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: quantum-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./qds_core:/app/qds_core
      - ./attack_sim:/app/attack_sim
      - ./detection_engine:/app/detection_engine
      - ./backend:/app/backend
      - ./backend:/app/api
    networks:
      - quantum-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # React + Vite Dashboard Service
  # ----------------------------------------------------------
  quantum-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: quantum-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./dashboard/src:/app/src
      - ./dashboard/public:/app/public
      - ./dashboard/index.html:/app/index.html
      - ./dashboard/vite.config.js:/app/vite.config.js
    networks:
      - quantum-network
    depends_on:
      quantum-backend:
        condition: service_healthy
    restart: unless-stopped
